name: Daily 08:30 screening

on:
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '40 23 * * 0-4'
    - cron: '50 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skip retry when today's result already exists
        id: check
        continue-on-error: true
        run: python scripts/verify_run.py

      - name: Scan KOSPI and KOSDAQ
        if: steps.check.outcome == 'failure' || github.event_name == 'workflow_dispatch'
        run: python scripts/screen_naver_fixed.py

      - name: Commit result
        if: steps.check.outcome == 'failure' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "stock-radar-bot@users.noreply.github.com"
          git add dist/data/results.json
          git diff --cached --quiet || git commit -m "data: daily screening"
          git push
