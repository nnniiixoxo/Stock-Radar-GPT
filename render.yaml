services:
  - type: web
    name: stock-radar-live-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KIWOOM_APP_KEY
        sync: false
      - key: KIWOOM_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
